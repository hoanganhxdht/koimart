# Render Blueprint - Tự động tạo database và web service
databases:
  - name: koimart-db
    databaseName: koimart
    user: koimart
    plan: free

services:
  - type: web
    name: koimart
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python init_data.py && gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: koimart-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
